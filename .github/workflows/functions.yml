name: Firebase Functions
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - run: npm run lint
        working-directory: functions
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && vars.FIREBASE_AUTO_DEPLOY_ENABLED == 'true'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: firebase-functions-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: npm ci
        working-directory: functions
      - name: Deploy the reviewed function
        run: npx --yes firebase-tools@15.35.0 deploy --only functions:addAdminRole --project beerpassport-b31d8 --non-interactive
